[package]
name = "gaugecode"
version = "0.1.0"
description = "Tray + notch overlay showing how much of your Claude Code, Cursor and Codex session limits you've used."
authors = ["Davi <@eurdavi>"]
license = "MIT"
repository = "https://github.com/eurdavi/gaugecode"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gaugecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Crate policy: see AGENTS.md ("Stack fixa"). Network (`reqwest`) and credential
# readers (`rusqlite`, `security-framework`) are added in M1/M3 and may only be
# used from `src/providers/`.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
async-trait = "0.1.92"
tracing = "0.1.44"
# Sink for `tracing`; reads RUST_LOG (e.g. RUST_LOG=gaugecode=debug).
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
