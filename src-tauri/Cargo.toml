[package]
name = "gaugecode"
version = "0.1.3"
description = "Tray + notch overlay showing how much of your Claude Code, Cursor and Codex session limits you've used."
authors = ["Davi <@eurdavi>"]
license = "MIT"
repository = "https://github.com/eurdavi/gaugecode"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gaugecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Crate policy: see AGENTS.md ("Stack fixa"). Network (`reqwest`) and credential
# readers (`rusqlite`, `security-framework`) are added in M1/M3 and may only be
# used from `src/providers/`.
[dependencies]
# `macos-private-api` is what makes a transparent window legal on macOS; the
# notch needs it (SPEC §9.1). It rules out the Mac App Store, which is fine.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
async-trait = "0.1.92"
tracing = "0.1.44"
# Sink for `tracing`; reads RUST_LOG (e.g. RUST_LOG=gaugecode=debug).
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["time", "sync", "fs", "rt", "macros"] }
sysinfo = "0.36.1"
tauri-plugin-positioner = { version = "2.3.4", features = ["tray-icon"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-os = "2.3.2"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.11.0"

# Keychain access for the Claude credential on macOS (SPEC §7.1).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

# Two Win32 calls the taskbar strip cannot do without (SPEC §9.5):
# `SetWindowPos` to re-assert topmost *without* dropping the flag first — which
# is what tao's `set_always_on_top` requires, and what made the strip flicker —
# and `GetAsyncKeyState` to know when a drag has ended on a window that is
# deliberately not focusable. Already in the tree via tauri, so it costs no
# extra compilation.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
