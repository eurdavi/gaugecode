name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no toolchain beyond Node: type-check and the network boundary.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Network boundary (SPEC §10)
        # Every network call and credential read must live in src-tauri/src/providers/.
        # Manifests (Cargo.toml/Cargo.lock) are allowed to name the crate.
        run: |
          set -euo pipefail
          if grep -rEn --include='*.rs' --include='*.ts' --include='*.tsx' \
               --exclude-dir=providers 'reqwest|fetch\(' src src-tauri/src; then
            echo '::error::network call outside src-tauri/src/providers/'
            exit 1
          fi
          echo 'boundary ok'

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundle_path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            bundle_path: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: tauri build
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: gaugecode-${{ matrix.platform }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
