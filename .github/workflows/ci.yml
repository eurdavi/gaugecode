name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no toolchain beyond Node: type-check and the network boundary.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Network and credential boundary (SPEC §10)
        # Every network call and every credential read must live in
        # src-tauri/src/providers/. Manifests may name the crates. `--exclude-dir`
        # matches a basename anywhere, so a frontend `src/providers/` would
        # slip through — the filter is path-anchored instead.
        run: |
          set -euo pipefail
          hits=$(grep -rEn --include='*.rs' --include='*.ts' --include='*.tsx' \
                 --include='*.html' --include='*.js' \
                 'reqwest|\bfetch\(|rusqlite|security_framework|navigator\.sendBeacon|new WebSocket|EventSource|tauri_plugin_http' \
                 src src-tauri/src bar.html notch.html popup.html settings.html \
                 | grep -v '^src-tauri/src/providers/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo '::error::network or credential access outside src-tauri/src/providers/'
            exit 1
          fi
          echo 'boundary ok'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundle_path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            bundle_path: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: ubuntu-latest
            bundle_path: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # WebKitGTK for the webview, ayatana-appindicator for the tray. The older
      # libappindicator3-dev is gone from Ubuntu 24.04, so only the ayatana one
      # is asked for.
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # Updater artifacts are signed, and the signing key has no business in a
      # workflow that runs on every pull request. The release job makes them.
      - name: tauri build
        run: pnpm tauri build --config src-tauri/tauri.ci.conf.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gaugecode-${{ matrix.platform }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
