name: release

# Tag a commit as v0.1.0 and this publishes the installers. Nothing is released
# from a branch push, so a green `ci` run never surprises anyone with a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            # Both Apple architectures in one .dmg, so an Intel Mac is not left out.
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-i18n-encoding.cjs

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Absent until the maintainer generates an updater key (SPEC §14).
          # Without them the release still builds; it just carries no .sig files,
          # so the in-app updater stays inert instead of shipping something
          # unverifiable.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GaugeCode ${{ github.ref_name }}
          releaseBody: |
            Read-only usage meter for Claude Code, Cursor, Codex, GLM, Grok and OpenCode.

            Windows: `.exe` or `.msi`. The build is unsigned, so SmartScreen warns
            once — "More info" then "Run anyway".
            macOS: universal `.dmg`, not notarised yet, so Gatekeeper warns once.
            Linux: `.AppImage` or `.deb`. The notch needs an X11 session; on
            Wayland it stays off and the tray takes over.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
